name: Collect 30-minute snapshot

on:
  schedule:
    - cron: "57 * * * *"
    - cron: "8 * * * *"
    - cron: "27 * * * *"
    - cron: "38 * * * *"
  workflow_dispatch:

concurrency:
  group: stream-pulse-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py"
      - name: Wait for the exact observation boundary
        if: ${{ github.event_name == 'schedule' && (github.event.schedule == '57 * * * *' || github.event.schedule == '27 * * * *') }}
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          import time
          from datetime import UTC, datetime, timedelta

          now = datetime.now(UTC)
          if os.environ["SCHEDULE_CRON"].startswith("57"):
              target = (now + timedelta(hours=1)).replace(minute=0, second=0, microsecond=0)
          else:
              target = now.replace(minute=30, second=0, microsecond=0)
          delay = (target - now).total_seconds()
          if 0 < delay <= 5 * 60:
              print(f"Waiting {delay:.1f}s for {target.isoformat()}")
              time.sleep(delay)
          PY
      - name: Collect, aggregate, and publish last-good JSON
        id: collect_publish
        if: ${{ env.R2_ACCOUNT_ID != '' && env.R2_ACCESS_KEY_ID != '' && env.R2_SECRET_ACCESS_KEY != '' && env.R2_BUCKET != '' }}
        continue-on-error: true
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            case "$SCHEDULE_CRON" in
              "57 * * * *"|"8 * * * *") args+=(--scheduled-minute 0) ;;
              "27 * * * *"|"38 * * * *") args+=(--scheduled-minute 30) ;;
            esac
          fi
          python -m src.pipeline --diagnostics-output runtime/collection-diagnostics.json "${args[@]}"
      - name: Validate the live YouTube sensor before R2 is configured
        id: collect_probe
        if: ${{ env.R2_ACCOUNT_ID == '' || env.R2_ACCESS_KEY_ID == '' || env.R2_SECRET_ACCESS_KEY == '' || env.R2_BUCKET == '' }}
        continue-on-error: true
        run: python -m src.pipeline --output runtime/live-probe.json --diagnostics-output runtime/collection-diagnostics.json
      - name: Retain classification diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stream-pulse-collection-diagnostics
          path: runtime/collection-diagnostics.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain the live sensor probe
        if: ${{ always() && (env.R2_ACCOUNT_ID == '' || env.R2_ACCESS_KEY_ID == '' || env.R2_SECRET_ACCESS_KEY == '' || env.R2_BUCKET == '') }}
        uses: actions/upload-artifact@v4
        with:
          name: stream-pulse-live-probe
          path: runtime/live-probe.json
          if-no-files-found: warn
          retention-days: 7
      - name: Propagate collection failure
        if: ${{ steps.collect_publish.outcome == 'failure' || steps.collect_probe.outcome == 'failure' }}
        run: exit 1

